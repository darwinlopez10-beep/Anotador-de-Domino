<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="28%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#122b54" />
      <stop offset="35%" stop-color="#0a1933" />
      <stop offset="70%" stop-color="#040b17" />
      <stop offset="100%" stop-color="#02060e" />
    </radialGradient>

    <!-- Golden Burst Behind Domino -->
    <radialGradient id="goldBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Sparkle Radial -->
    <radialGradient id="sparkleCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </radialGradient>

    <!-- Tile Surface Gradient -->
    <linearGradient id="tileFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fbf8f2" />
      <stop offset="70%" stop-color="#f1e9dc" />
      <stop offset="100%" stop-color="#e4d8c7" />
    </linearGradient>

    <!-- Tile 3D Side/Bevel Gradient -->
    <linearGradient id="tileSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6c7b2" />
      <stop offset="50%" stop-color="#b8a790" />
      <stop offset="100%" stop-color="#8c7a65" />
    </linearGradient>

    <!-- Tile Drop Shadow -->
    <filter id="tileShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-14" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.2" />
    </filter>

    <!-- Pip (Dot) Inset Shadow & 3D Gradient -->
    <radialGradient id="pipGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2d2a26" />
      <stop offset="50%" stop-color="#141210" />
      <stop offset="90%" stop-color="#050505" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Gold 3D Text Gradients -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="15%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="goldTextSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Cyan Neon Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00d2ff" flood-opacity="0.75" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1024" height="500" fill="url(#bgGlow)" />

  <!-- Background Dots Grid Pattern Subtle -->
  <g opacity="0.07" fill="#ffffff">
    <circle cx="100" cy="80" r="1.5" /><circle cx="140" cy="80" r="1.5" /><circle cx="180" cy="80" r="1.5" />
    <circle cx="100" cy="120" r="1.5" /><circle cx="140" cy="120" r="1.5" /><circle cx="180" cy="120" r="1.5" />
    <circle cx="100" cy="160" r="1.5" /><circle cx="140" cy="160" r="1.5" /><circle cx="180" cy="160" r="1.5" />
    <circle cx="820" cy="380" r="1.5" /><circle cx="860" cy="380" r="1.5" /><circle cx="900" cy="380" r="1.5" />
    <circle cx="820" cy="420" r="1.5" /><circle cx="860" cy="420" r="1.5" /><circle cx="900" cy="420" r="1.5" />
  </g>

  <!-- Golden Radiant Blast behind tile -->
  <circle cx="300" cy="245" r="230" fill="url(#goldBurst)" />

  <!-- Dynamic Starburst Beams -->
  <g opacity="0.45">
    <polygon points="300,245 420,110 370,245" fill="#fde047" />
    <polygon points="300,245 460,210 370,265" fill="#fbbf24" />
    <polygon points="300,245 420,360 350,295" fill="#f59e0b" />
    <polygon points="300,245 220,120 280,215" fill="#fde047" />
    <polygon points="300,245 150,230 260,260" fill="#fde047" />
    <polygon points="300,245 190,360 270,290" fill="#f59e0b" />
  </g>

  <!-- Floating Golden Sparkles -->
  <g>
    <!-- Big star near top-right of domino -->
    <g transform="translate(325, 170)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#ffffff" filter="url(#goldGlow)" />
      <circle cx="0" cy="0" r="3" fill="#fef08a" />
    </g>
    <!-- Star near bottom-right -->
    <g transform="translate(365, 335)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#fffbeb" />
    </g>
    <!-- Star near top-left -->
    <g transform="translate(130, 215)">
      <polygon points="0,-10 2.5,-2.5 10,0 2.5,2.5 0,10 -2.5,2.5 -10,0 -2.5,-2.5" fill="#fef08a" />
    </g>
    <!-- Little shiny dots -->
    <circle cx="345" cy="130" r="2.5" fill="#fef08a" opacity="0.9" />
    <circle cx="380" cy="275" r="3" fill="#ffffff" opacity="0.85" />
    <circle cx="150" cy="310" r="2" fill="#fde047" opacity="0.75" />
    <circle cx="280" cy="95" r="2" fill="#fff" opacity="0.8" />
    <circle cx="360" cy="390" r="2.5" fill="#fde047" opacity="0.8" />
  </g>

  <!-- ==================== 3D DOMINO TILE (Tilted ~-11deg) ==================== -->
  <g transform="translate(230, 248) rotate(-11)" filter="url(#tileShadow)">
    
    <!-- 3D Extrusion Side (Gives realistic depth & thickness) -->
    <rect x="-82" y="-192" width="168" height="388" rx="26" fill="url(#tileSide)" />
    
    <!-- Front Face of Domino Tile -->
    <rect x="-85" y="-195" width="166" height="384" rx="24" fill="url(#tileFace)" stroke="#ffffff" stroke-width="2" />

    <!-- Tile Inner Highlight Edge -->
    <rect x="-83" y="-193" width="162" height="380" rx="22" fill="none" stroke="#fff" stroke-width="1.5" stroke-opacity="0.7" />

    <!-- Center Divider Bar (Deep carved groove) -->
    <line x1="-66" y1="-3" x2="66" y2="-3" stroke="#948b7d" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-66" y1="-1" x2="66" y2="-1" stroke="#2b261f" stroke-width="3" stroke-linecap="round" />
    <line x1="-66" y1="1" x2="66" y2="1" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8" stroke-linecap="round" />

    <!-- Brass Center Pivot Pin -->
    <circle cx="0" cy="-1" r="5" fill="url(#goldTextGrad)" stroke="#78350f" stroke-width="1.2" />

    <!-- ================= TOP HALF: 6 PIPS ================= -->
    <!-- Column 1 (Left) -->
    <g transform="translate(-38, -135)">
      <circle cx="0" cy="0" r="13" fill="url(#pipGrad)" />
      <circle cx="-3" cy="-3" r="2.5" fill="#ffffff" opacity="0.45" />
    </g>
    <g transform="translate(-38, -85)">
      <circle cx="0" cy="0" r="13" fill="url(#pipGrad)" />
      <circle cx="-3" cy="-3" r="2.5" fill="#ffffff" opacity="0.45" />
    </g>
    <g transform="translate(-38, -35)">
      <circle cx="0" cy="0" r="13" fill="url(#pipGrad)" />
      <circle cx="-3" cy="-3" r="2.5" fill="#ffffff" opacity="0.45" />
    </g>

    <!-- Column 2 (Right) -->
    <g transform="translate(38, -135)">
      <circle cx="0" cy="0" r="13" fill="url(#pipGrad)" />
      <circle cx="-3" cy="-3" r="2.5" fill="#ffffff" opacity="0.45" />
    </g>
    <g transform="translate(38, -85)">
      <circle cx="0" cy="0" r="13" fill="url(#pipGrad)" />
      <circle cx="-3" cy="-3" r="2.5" fill="#ffffff" opacity="0.45" />
    </g>
    <g transform="translate(38, -35)">
      <circle cx="0" cy="0" r="13" fill="url(#pipGrad)" />
      <circle cx="-3" cy="-3" r="2.5" fill="#ffffff" opacity="0.45" />
    </g>

    <!-- ================= BOTTOM HALF: 5 PIPS ================= -->
    <!-- Top-Left -->
    <g transform="translate(-38, 35)">
      <circle cx="0" cy="0" r="13" fill="url(#pipGrad)" />
      <circle cx="-3" cy="-3" r="2.5" fill="#ffffff" opacity="0.45" />
    </g>
    <!-- Top-Right -->
    <g transform="translate(38, 35)">
      <circle cx="0" cy="0" r="13" fill="url(#pipGrad)" />
      <circle cx="-3" cy="-3" r="2.5" fill="#ffffff" opacity="0.45" />
    </g>
    <!-- Center Pip -->
    <g transform="translate(0, 85)">
      <circle cx="0" cy="0" r="13" fill="url(#pipGrad)" />
      <circle cx="-3" cy="-3" r="2.5" fill="#ffffff" opacity="0.45" />
    </g>
    <!-- Bottom-Left -->
    <g transform="translate(-38, 135)">
      <circle cx="0" cy="0" r="13" fill="url(#pipGrad)" />
      <circle cx="-3" cy="-3" r="2.5" fill="#ffffff" opacity="0.45" />
    </g>
    <!-- Bottom-Right -->
    <g transform="translate(38, 135)">
      <circle cx="0" cy="0" r="13" fill="url(#pipGrad)" />
      <circle cx="-3" cy="-3" r="2.5" fill="#ffffff" opacity="0.45" />
    </g>
  </g>

  <!-- ==================== RIGHT SIDE TYPOGRAPHY ==================== -->
  <!-- "MESA &" 3D Text -->
  <g filter="url(#goldGlow)">
    <!-- 3D Bottom Extrusion Shadows -->
    <text x="470" y="148" font-family="'Montserrat', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="86" fill="url(#goldTextSide)" letter-spacing="1.5">MESA &amp;</text>
    <text x="470" y="144" font-family="'Montserrat', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="86" fill="#78350f" letter-spacing="1.5">MESA &amp;</text>
    <!-- Main Golden Face -->
    <text x="470" y="140" font-family="'Montserrat', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="86" fill="url(#goldTextGrad)" stroke="#fef08a" stroke-width="1.5" letter-spacing="1.5">MESA &amp;</text>
  </g>

  <!-- "DOMINÓ" 3D Text -->
  <g filter="url(#goldGlow)">
    <!-- 3D Bottom Extrusion Shadows -->
    <text x="468" y="244" font-family="'Montserrat', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="94" fill="url(#goldTextSide)" letter-spacing="2">DOMINÓ</text>
    <text x="468" y="240" font-family="'Montserrat', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="94" fill="#78350f" letter-spacing="2">DOMINÓ</text>
    <!-- Main Golden Face -->
    <text x="468" y="235" font-family="'Montserrat', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="94" fill="url(#goldTextGrad)" stroke="#fef08a" stroke-width="1.5" letter-spacing="2">DOMINÓ</text>
  </g>

  <!-- "- ANOTADOR -" Cyan Neon Subtitle -->
  <g filter="url(#cyanGlow)">
    <text x="700" y="306" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="url(#cyanGrad)" text-anchor="middle" letter-spacing="5">- ANOTADOR -</text>
  </g>

  <!-- "ANOTADOR DE PUNTOS" White Headline -->
  <text x="700" y="365" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    ANOTADOR DE PUNTOS
  </text>

  <!-- "Control rápido y automático para tus partidas." Subtitle -->
  <text x="700" y="415" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#cbd5e1" text-anchor="middle" opacity="0.95">
    Control rápido y automático para tus partidas.
  </text>
</svg>
