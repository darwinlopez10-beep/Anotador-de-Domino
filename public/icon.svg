<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f4" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#amberGrad)" stroke-width="6" stroke-opacity="0.5" />

  <!-- Domino Tile Body -->
  <g filter="url(#tileShadow)">
    <rect x="156" y="86" width="200" height="340" rx="28" fill="url(#tileGrad)" stroke="#e7e5e4" stroke-width="4" />
    
    <!-- Divider Line with brass/amber pin -->
    <line x1="176" y1="256" x2="336" y2="256" stroke="#a8a29e" stroke-width="4" stroke-linecap="round" />
    <circle cx="256" cy="256" r="7" fill="url(#amberGrad)" stroke="#78350f" stroke-width="2" />

    <!-- Top Half Dots: 4 dots -->
    <circle cx="196" cy="126" r="13" fill="#1c1917" />
    <circle cx="316" cy="126" r="13" fill="#1c1917" />
    <circle cx="196" cy="216" r="13" fill="#1c1917" />
    <circle cx="316" cy="216" r="13" fill="#1c1917" />

    <!-- Bottom Half Dots: 6 dots -->
    <circle cx="196" cy="296" r="13" fill="#1c1917" />
    <circle cx="316" cy="296" r="13" fill="#1c1917" />
    <circle cx="196" cy="346" r="13" fill="#1c1917" />
    <circle cx="316" cy="346" r="13" fill="#1c1917" />
    <circle cx="196" cy="396" r="13" fill="#1c1917" />
    <circle cx="316" cy="396" r="13" fill="#1c1917" />
  </g>

  <!-- Amber corner score badge -->
  <circle cx="376" cy="126" r="28" fill="url(#amberGrad)" stroke="#ffffff" stroke-width="3" />
  <text x="376" y="134" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#1c1917" text-anchor="middle">★</text>
</svg>
