<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="mTileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f4" />
    </linearGradient>
    <linearGradient id="mAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#mBgGrad)" />

  <!-- Domino inside safe zone (central 80% circle) -->
  <g transform="translate(256 256) scale(0.85) translate(-256 -256)">
    <rect x="166" y="96" width="180" height="320" rx="24" fill="url(#mTileGrad)" stroke="#e7e5e4" stroke-width="4" />
    <line x1="186" y1="256" x2="326" y2="256" stroke="#a8a29e" stroke-width="4" stroke-linecap="round" />
    <circle cx="256" cy="256" r="6" fill="url(#mAmberGrad)" />

    <!-- 4 dots top -->
    <circle cx="206" cy="136" r="12" fill="#1c1917" />
    <circle cx="306" cy="136" r="12" fill="#1c1917" />
    <circle cx="206" cy="216" r="12" fill="#1c1917" />
    <circle cx="306" cy="216" r="12" fill="#1c1917" />

    <!-- 6 dots bottom -->
    <circle cx="206" cy="296" r="12" fill="#1c1917" />
    <circle cx="306" cy="296" r="12" fill="#1c1917" />
    <circle cx="206" cy="341" r="12" fill="#1c1917" />
    <circle cx="306" cy="341" r="12" fill="#1c1917" />
    <circle cx="206" cy="386" r="12" fill="#1c1917" />
    <circle cx="306" cy="386" r="12" fill="#1c1917" />
  </g>
</svg>
