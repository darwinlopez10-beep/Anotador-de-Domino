<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="maskBgGlow" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#122b54" />
      <stop offset="35%" stop-color="#0a1933" />
      <stop offset="70%" stop-color="#040b17" />
      <stop offset="100%" stop-color="#02060e" />
    </radialGradient>

    <radialGradient id="maskGoldBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="65%" stop-color="#d97706" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="maskTileFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fbf8f2" />
      <stop offset="70%" stop-color="#f1e9dc" />
      <stop offset="100%" stop-color="#e4d8c7" />
    </linearGradient>

    <linearGradient id="maskTileSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6c7b2" />
      <stop offset="50%" stop-color="#b8a790" />
      <stop offset="100%" stop-color="#8c7a65" />
    </linearGradient>

    <filter id="maskTileShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-8" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.25" />
    </filter>

    <radialGradient id="maskPipGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2d2a26" />
      <stop offset="50%" stop-color="#141210" />
      <stop offset="90%" stop-color="#050505" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <linearGradient id="maskGoldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="15%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="maskGoldTextSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="maskCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background for Safe Area Masks -->
  <rect width="512" height="512" fill="url(#maskBgGlow)" />

  <!-- Flare Burst Behind Right Edge (x=330, y=210) -->
  <circle cx="330" cy="210" r="200" fill="url(#maskGoldBurst)" />

  <!-- Sparkles -->
  <g transform="translate(365, 145)">
    <polygon points="0,-14 3.5,-3.5 14,0 3.5,3.5 0,14 -3.5,3.5 -14,0 -3.5,-3.5" fill="#ffffff" />
  </g>
  <circle cx="140" cy="180" r="2.5" fill="#fef08a" />
  <circle cx="390" cy="290" r="3" fill="#ffffff" />
  <circle cx="150" cy="340" r="2.5" fill="#fde047" />

  <!-- Domino Tile Centered in Safe Zone (Scale 0.82) -->
  <g transform="translate(250, 258) rotate(-16) scale(0.82)" filter="url(#maskTileShadow)">
    <rect x="-83" y="-192" width="170" height="390" rx="28" fill="url(#maskTileSide)" />
    <rect x="-85" y="-195" width="166" height="386" rx="26" fill="url(#maskTileFace)" stroke="#ffffff" stroke-width="2" />
    <rect x="-83" y="-193" width="162" height="382" rx="24" fill="none" stroke="#fff" stroke-width="1.5" stroke-opacity="0.75" />

    <rect x="-70" y="-5" width="140" height="9" rx="4.5" fill="#1c1917" opacity="0.9" />
    <line x1="-66" y1="-3" x2="66" y2="-3" stroke="#000000" stroke-width="3" stroke-linecap="round" />
    <line x1="-66" y1="3" x2="66" y2="3" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8" stroke-linecap="round" />

    <!-- Top 6 Pips -->
    <g transform="translate(-36, -132)"><circle cx="0" cy="0" r="14" fill="url(#maskPipGrad)" /><circle cx="-3.5" cy="-3.5" r="3" fill="#ffffff" opacity="0.35" /></g>
    <g transform="translate(-36, -82)"><circle cx="0" cy="0" r="14" fill="url(#maskPipGrad)" /><circle cx="-3.5" cy="-3.5" r="3" fill="#ffffff" opacity="0.35" /></g>
    <g transform="translate(-36, -32)"><circle cx="0" cy="0" r="14" fill="url(#maskPipGrad)" /><circle cx="-3.5" cy="-3.5" r="3" fill="#ffffff" opacity="0.35" /></g>
    <g transform="translate(36, -132)"><circle cx="0" cy="0" r="14" fill="url(#maskPipGrad)" /><circle cx="-3.5" cy="-3.5" r="3" fill="#ffffff" opacity="0.35" /></g>
    <g transform="translate(36, -82)"><circle cx="0" cy="0" r="14" fill="url(#maskPipGrad)" /><circle cx="-3.5" cy="-3.5" r="3" fill="#ffffff" opacity="0.35" /></g>
    <g transform="translate(36, -32)"><circle cx="0" cy="0" r="14" fill="url(#maskPipGrad)" /><circle cx="-3.5" cy="-3.5" r="3" fill="#ffffff" opacity="0.35" /></g>

    <!-- Bottom 5 Pips -->
    <g transform="translate(-36, 36)"><circle cx="0" cy="0" r="14" fill="url(#maskPipGrad)" /><circle cx="-3.5" cy="-3.5" r="3" fill="#ffffff" opacity="0.35" /></g>
    <g transform="translate(36, 36)"><circle cx="0" cy="0" r="14" fill="url(#maskPipGrad)" /><circle cx="-3.5" cy="-3.5" r="3" fill="#ffffff" opacity="0.35" /></g>
    <g transform="translate(0, 86)"><circle cx="0" cy="0" r="14" fill="url(#maskPipGrad)" /><circle cx="-3.5" cy="-3.5" r="3" fill="#ffffff" opacity="0.35" /></g>
    <g transform="translate(-36, 136)"><circle cx="0" cy="0" r="14" fill="url(#maskPipGrad)" /><circle cx="-3.5" cy="-3.5" r="3" fill="#ffffff" opacity="0.35" /></g>
    <g transform="translate(36, 136)"><circle cx="0" cy="0" r="14" fill="url(#maskPipGrad)" /><circle cx="-3.5" cy="-3.5" r="3" fill="#ffffff" opacity="0.35" /></g>
  </g>
</svg>
